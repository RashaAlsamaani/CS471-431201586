<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Publisher Filtered Books Count</title>
</head>
<body>
    <h1>Publishers - Filtered Books Count (Price > 50 & 1 &lt;= Quantity &lt; 5)</h1>
    <table border="1" cellpadding="8">
        <tr>
            <th>Publisher Name</th>
            <th>Location</th>
            <th>Filtered Books Count</th>
        </tr>
        {% for publisher in publishers %}
        <tr>
            <td>{{ publisher.name }}</td>
            <td>{{ publisher.location }}</td>
            <td>{{ publisher.filtered_books_count }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No publishers found in the database.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
